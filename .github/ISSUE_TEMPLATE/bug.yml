name: Bug report
description: Report an issue that should be fixed
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report.
  - type: dropdown
    attributes:
      label: Which agent has the bug?
      options:
        - Claude Code
        - Cursor
        - Codex
    validations:
      required: true
  - type: input
    attributes:
      label: What plugin version are you using?
      description: Copy the installed version or GitHub release tag.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: What kind of platform do you use?
      options:
        - MacOS
        - Windows
        - Linux
  - type: textarea
    attributes:
      label: What steps can reproduce the bug?
      description: |
        Include the skill, command, rule, or agent involved.
        Add the smallest relevant configuration or prompt.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: How often does this bug happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Only once
  - type: textarea
    attributes:
      label: What is the expected behavior?
      description: If possible, please provide text instead of a screenshot.
  - type: textarea
    attributes:
      label: Additional information
      description: Is there anything else you think we should know?
