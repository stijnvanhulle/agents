name: Release
on:
  push:
    branches: [ 'main' ]
    paths:
      - '.changeset/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.cursor-plugin/**'
      - 'scripts/syncPluginVersion.mjs'
      - 'tools/claude/**'
      - 'tools/cursor/**'
      - 'tools/codex/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository_owner == 'stijnvanhulle'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This workflow never publishes to npm. One GitHub Release titled vX.Y.Z,
      # tagged agents@X.Y.Z, matching kubb-labs/kubb's combined release-mode.
      - name: Create Release PR or GitHub Releases
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run release:version
          publish-script: pnpm release
          commit-message: 'ci(changesets): version packages'
          pr-title: 'ci(changesets): version packages'
          create-github-releases: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
